[project]
name = "airfare-intelligence"
version = "0.1.0"
description = "SIH26056 real-time airfare price intelligence MVP"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "streamlit>=1.39", "httpx>=0.27", "requests>=2.32", "pandas>=2.2", "pydantic>=2.9"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
airfare-api = "app:main"
airfare-dashboard = "dashboard:main"

[project.optional-dependencies]
crawler = ["crawl4ai>=0.4"]
local-llm = ["ollama>=0.4"]
postgres = ["sqlalchemy>=2.0", "psycopg[binary]>=3.2"]
redis = ["redis>=5.0"]
celery = ["celery>=5.4"]

[tool.ruff]
line-length = 100
