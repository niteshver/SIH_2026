services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./airfare.db}
  dashboard:
    build: .
    command: streamlit run src/dashboard.py --server.address 0.0.0.0 --server.port 8501
    ports: ["8501:8501"]
    environment:
      API_URL: http://api:8000
    depends_on: [api]
